# Extractores DIARIOS → Supabase, solo cuando hay datos nuevos.
#
# Cada 3 horas, el trabajo "revisar" mira en Supabase qué tan al día está cada tema
# (extractores/src/comun/novedades.ts) y solo corren los extractores que tienen algo nuevo que traer; si todo
# está al día, no se llama a ninguna fuente. Si GitHub atrasa o se salta una corrida (le pasa a la hora en
# punto, cuando tiene mucha carga), la siguiente revisión lo recoge. Cada corrida deja en su resumen una tabla
# con qué se bajó y por qué.
#
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (+ los de cada fuente que los necesite).
#   EARTHDATA_USERNAME, EARTHDATA_PASSWORD: lluvia por satélite (GPM IMERG). La cuenta de Earthdata debe tener
#   autorizada la aplicación "NASA GESDISC DATA ARCHIVE" (Profile > Applications > Authorized Apps).
#
# Open-Meteo gratis permite 10 000 llamadas/día y 5 000/hora. Clima (tema 1) y humedad (tema 2) consultan
# ~4 000 puntos cada uno: la revisión nunca los corre en la misma hora. Si Open-Meteo falla (por ejemplo, por
# el límite diario, que GitHub comparte entre usuarios), el clima y la humedad salen de NASA POWER.
name: Extractores diarios

on:
  schedule:
    - cron: '23 */3 * * *' # cada 3 horas, a los :23 (en punto GitHub atrasa las corridas programadas)
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Qué correr a mano (revisar = solo lo que tenga datos nuevos)'
        type: choice
        options: [revisar, clima-y-agua, humedad, riesgos, precios, lluvia-satelite]
        default: revisar

concurrency:
  group: extractores-diarios
  cancel-in-progress: false

env:
  # La URL no es secreta: si no existe el secreto SUPABASE_URL, se usa el de la web (VITE_SUPABASE_URL).
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  # ¿Hay datos nuevos? Solo lee Supabase; decide qué trabajos de abajo corren.
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      clima: ${{ steps.revision.outputs.clima }}
      humedad: ${{ steps.revision.outputs.humedad }}
      precios: ${{ steps.revision.outputs.precios }}
      imn: ${{ steps.revision.outputs.imn }}
      lluvia: ${{ steps.revision.outputs.lluvia }}
      precios_hasta: ${{ steps.revision.outputs.precios_hasta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ¿Hay datos nuevos?
        id: revision
        run: npm run extraer -- novedades

  clima-y-agua:
    needs: revisar
    if: needs.revisar.outputs.clima == 'true' || inputs.grupo == 'clima-y-agua'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Tema 1 · Clima (Open-Meteo, últimos 7 días, 492 distritos)
      - name: Clima Open-Meteo
        id: clima
        continue-on-error: true # si falla, entra el respaldo de abajo; la próxima revisión vuelve a probar Open-Meteo
        run: npm run extraer -- clima

      # Respaldo: si Open-Meteo no responde (por ejemplo, se pasó su límite diario, que GitHub comparte con otros
      # usuarios), el clima de los últimos días sale de NASA POWER (≈ 30 consultas para todo el país). La web ya usa
      # POWER para los días que no tengan Open-Meteo. POWER publica con 2 o 3 días de atraso.
      - name: Clima NASA POWER (respaldo)
        if: steps.clima.outcome == 'failure'
        run: |
          echo "::warning title=Respaldo de clima::Open-Meteo no respondió; el clima de estos días sale de NASA POWER."
          npm run extraer -- temperatura-power

      # Tema 4 · Estudio hídrico: suma lo que el paso anterior guardó en clima_diario (sin llamadas a APIs)
      - name: Agua Open-Meteo
        if: ${{ !cancelled() }}
        run: npm run extraer -- agua-open-meteo

  humedad:
    needs: revisar
    if: needs.revisar.outputs.humedad == 'true' || inputs.grupo == 'humedad'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Tema 2 · Humedad del suelo (Open-Meteo, 3 profundidades, últimos 7 días)
      - name: Humedad del suelo Open-Meteo
        id: humedad
        continue-on-error: true
        run: npm run extraer -- humedad-open-meteo

      # Respaldo: la humedad del suelo de NASA POWER (superficie, raíz y perfil), igual que el clima.
      - name: Humedad del suelo NASA POWER (respaldo)
        if: steps.humedad.outcome == 'failure'
        run: |
          echo "::warning title=Respaldo de humedad::Open-Meteo no respondió; la humedad del suelo sale de NASA POWER."
          npm run extraer -- humedad-power

  # Lluvia por satélite (NASA GPM IMERG, producto Early diario de 0,1°): una consulta por día UTC para todo el
  # país. Se guarda aparte (lluvia_satelite) y el resumen de la corrida la compara con la lluvia de Open-Meteo.
  lluvia-satelite:
    needs: revisar
    if: needs.revisar.outputs.lluvia == 'true' || inputs.grupo == 'lluvia-satelite'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lluvia GPM IMERG
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: npm run extraer -- lluvia-imerg

  # Tema 3 · Boletín diario PIMA-CENADA (lunes a viernes, hasta que salga el de hoy). El portal necesita Chrome
  # (ya viene en ubuntu-latest) y el PDF se lee con pdftotext (poppler-utils).
  precios-pima:
    needs: revisar
    if: needs.revisar.outputs.precios == 'true' || inputs.grupo == 'precios'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      nuevos: ${{ steps.boletin.outputs.nuevos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y poppler-utils
      - name: Precios PIMA-CENADA
        run: npm run extraer -- precios-pima
      # Si el portal todavía no publica el de hoy, se guardan los mismos (la llave evita duplicados) y no se
      # recalcula nada; la próxima revisión vuelve a probar.
      - name: ¿Llegó un boletín nuevo?
        id: boletin
        env:
          ANTES: ${{ needs.revisar.outputs.precios_hasta }}
        run: npm run extraer -- precios-nuevos --desde="$ANTES"

  # Resultado · Con precios nuevos cambia la nota de mercado: se recalcula el orden de los cultivos recomendados
  # (también corre los lunes en semanal.yml, con el clima de NASA POWER y los precios del CNP).
  aptitud:
    needs: precios-pima
    if: needs.precios-pima.outputs.nuevos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aptitud de cultivos por distrito
        run: npm run extraer -- aptitud

  # Tema 8 · Pronóstico subestacional del IMN: automático, una consulta a su página pública por día.
  imn-subestacional:
    needs: revisar
    if: needs.revisar.outputs.imn == 'true' || inputs.grupo == 'riesgos'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pronóstico subestacional IMN
        run: npm run extraer -- imn-subestacional

  # Tema 8 · Boletines revisados a mano de CNE e IMN (la CNE bloquea el acceso automático). Una vez al día,
  # junto con el pronóstico del IMN. Habilitar solo después de preparar boletines revisados: variable del
  # repositorio RIESGOS_REVISADOS_HABILITADOS = true (Settings > Secrets and variables > Actions > Variables).
  riesgos:
    needs: revisar
    if: vars.RIESGOS_REVISADOS_HABILITADOS == 'true' && (needs.revisar.outputs.imn == 'true' || inputs.grupo == 'riesgos')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extractor: [cne, imn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Importar boletín revisado
        env:
          EXTRACTOR: ${{ matrix.extractor }}
        run: npm run extraer -- "$EXTRACTOR"
