# Extractores DIARIOS → Supabase, solo cuando hay datos nuevos.
#
# Cada 3 horas, el trabajo "revisar" mira en Supabase qué tan al día está cada tema
# (extractores/src/comun/novedades.ts) y solo corren los extractores que tienen algo nuevo que traer; si todo
# está al día, no se llama a ninguna fuente. Si GitHub atrasa o se salta una corrida (le pasa a la hora en
# punto, cuando tiene mucha carga), la siguiente revisión lo recoge. Cada corrida deja en su resumen una tabla
# con qué se bajó y por qué.
#
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (+ los de cada fuente que los necesite).
#
# Open-Meteo gratis permite 10 000 llamadas/día y 5 000/hora. Clima (tema 1) y humedad (tema 2) consultan
# ~4 000 puntos cada uno: la revisión nunca los corre en la misma hora.
name: Extractores diarios

on:
  schedule:
    - cron: '23 */3 * * *' # cada 3 horas, a los :23 (en punto GitHub atrasa las corridas programadas)
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Qué correr a mano (revisar = solo lo que tenga datos nuevos)'
        type: choice
        options: [revisar, clima-y-agua, humedad, riesgos, precios]
        default: revisar

concurrency:
  group: extractores-diarios
  cancel-in-progress: false

env:
  # La URL no es secreta: si no existe el secreto SUPABASE_URL, se usa el de la web (VITE_SUPABASE_URL).
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  # ¿Hay datos nuevos? Solo lee Supabase; decide qué trabajos de abajo corren.
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      clima: ${{ steps.revision.outputs.clima }}
      humedad: ${{ steps.revision.outputs.humedad }}
      precios: ${{ steps.revision.outputs.precios }}
      imn: ${{ steps.revision.outputs.imn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ¿Hay datos nuevos?
        id: revision
        run: npm run extraer -- novedades

  clima-y-agua:
    needs: revisar
    if: needs.revisar.outputs.clima == 'true' || inputs.grupo == 'clima-y-agua'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Tema 1 · Clima (Open-Meteo, últimos 7 días, 492 distritos)
      - name: Clima Open-Meteo
        run: npm run extraer -- clima

      # Tema 4 · Estudio hídrico: suma lo que el paso anterior guardó en clima_diario (sin llamadas a APIs)
      - name: Agua Open-Meteo
        if: ${{ !cancelled() }}
        run: npm run extraer -- agua-open-meteo

  humedad:
    needs: revisar
    if: needs.revisar.outputs.humedad == 'true' || inputs.grupo == 'humedad'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Tema 2 · Humedad del suelo (Open-Meteo, 3 profundidades, últimos 7 días)
      - name: Humedad del suelo Open-Meteo
        run: npm run extraer -- humedad-open-meteo

  # Tema 3 · Boletín diario PIMA-CENADA (lunes a viernes, hasta que salga el de hoy). El portal necesita Chrome
  # (ya viene en ubuntu-latest) y el PDF se lee con pdftotext (poppler-utils).
  precios-pima:
    needs: revisar
    if: needs.revisar.outputs.precios == 'true' || inputs.grupo == 'precios'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y poppler-utils
      - name: Precios PIMA-CENADA
        run: npm run extraer -- precios-pima

  # Tema 8 · Pronóstico subestacional del IMN: automático, una consulta a su página pública por día.
  imn-subestacional:
    needs: revisar
    if: needs.revisar.outputs.imn == 'true' || inputs.grupo == 'riesgos'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pronóstico subestacional IMN
        run: npm run extraer -- imn-subestacional

  # Tema 8 · Boletines revisados a mano de CNE e IMN (la CNE bloquea el acceso automático). Una vez al día,
  # junto con el pronóstico del IMN. Habilitar solo después de preparar boletines revisados: variable del
  # repositorio RIESGOS_REVISADOS_HABILITADOS = true (Settings > Secrets and variables > Actions > Variables).
  riesgos:
    needs: revisar
    if: vars.RIESGOS_REVISADOS_HABILITADOS == 'true' && (needs.revisar.outputs.imn == 'true' || inputs.grupo == 'riesgos')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extractor: [cne, imn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Importar boletín revisado
        env:
          EXTRACTOR: ${{ matrix.extractor }}
        run: npm run extraer -- "$EXTRACTOR"
