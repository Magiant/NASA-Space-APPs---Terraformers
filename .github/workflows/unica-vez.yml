# Generated with assistance from Claude (SI)
# Cargas que se corren UNA VEZ (o pocas veces), a mano desde la pestaña Actions.
# Elegir el extractor y, si aplica, sus opciones (p. ej. --desde=2025-01-01 --hasta=2025-12-31).
name: Cargas únicas

on:
  workflow_dispatch:
    inputs:
      extractor:
        description: 'Extractor a correr'
        required: true
        type: choice
        options:
          - clima-historico
          - amenazas
          # Los demás temas agregan aquí su carga única (distritos, elevacion, soilgrids...).
          # Tema 10 · Compatibilidad del sector. Orden recomendado:
          # soilgrids → ecocrop, gaez, areas-protegidas → capacidad-uso (al final).
          # El censo se corre en local con el Excel del INEC (CENSO_EXCEL=ruta.xlsx npm run extraer -- censo).
          - soilgrids
          - ecocrop
          - gaez
          - areas-protegidas
          - capacidad-uso
          # Los demás temas agregan aquí su carga única (distritos, elevacion...).

      opciones:
        description: 'Opciones extra, ej. --desde=2025-01-01 --hasta=2025-12-31 --presupuesto=9000'
        required: false
        default: ''

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Solo lo usa areas-protegidas (token gratis en https://api.protectedplanet.net/request).
      WDPA_API_TOKEN: ${{ secrets.WDPA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Guarda los mapas de SoilGrids y GAEZ ya bajados para no volver a descargarlos.
      - uses: actions/cache@v4
        with:
          path: extractores/.cache
          key: extractores-cache-${{ inputs.extractor }}-${{ github.run_id }}
          restore-keys: extractores-cache-${{ inputs.extractor }}-
      - name: Carga ${{ inputs.extractor }}
        env:
          EXTRACTOR: ${{ inputs.extractor }}
          OPCIONES: ${{ inputs.opciones }}
        # Las entradas van por variables de entorno (no interpoladas en el script) para evitar inyección.
        run: npm run extraer -- "$EXTRACTOR" $OPCIONES
