
# Extractores SEMANALES → Supabase. Cada tema agrega su paso en el job `extraer`.
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (+ los de cada fuente que los necesite).
name: Extractores semanales

on:
  schedule:
    - cron: '0 10 * * 1'   # lunes 04:00 hora de Costa Rica (UTC-6)
    # Lunes a las 02:00 de Costa Rica (UTC-6).
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capacitacion-ina
  cancel-in-progress: false

jobs:
  capacitacion-ina:
    runs-on: ubuntu-latest
    timeout-minutes: 15
  workflow_dispatch:

concurrency:
  group: extractores-semanales
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test extractores/test/capacitacion-ina.test.ts
      - name: Cargar CSV revisado del INA
        run: npm run extraer -- capacitacion-ina --archivo=../docs/capacitacion/plantilla.csv
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          node-version: 24
          cache: npm
      - run: npm ci

      # Tema 2 · Humedad del suelo (NASA POWER: superficie, raíz y perfil, últimos 14 días)
      - name: Humedad del suelo NASA POWER
        run: npm run extraer -- humedad-power