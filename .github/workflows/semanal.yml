# Extractores SEMANALES → Supabase. Cada tema agrega su paso en el job `extraer`.
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (+ los de cada fuente que los necesite):
#   ECOSTRESS (AppEEARS) necesita EARTHDATA_USERNAME y EARTHDATA_PASSWORD (AppEEARS rechaza el token).
name: Extractores semanales

on:
  schedule:
    - cron: '0 10 * * 1'   # lunes 04:00 hora de Costa Rica (UTC-6)
  workflow_dispatch:

concurrency:
  group: extractores-semanales
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # ECOSTRESS espera a que AppEEARS procese (hasta 90 min por tarea)
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Tema 2 · Humedad del suelo (NASA POWER: superficie, raíz y perfil, últimos 14 días)
      - name: Humedad del suelo NASA POWER
        run: npm run extraer -- humedad-power

      # Tema 7 · Temperatura NASA POWER corregida por altitud (últimos 21 días)
      - name: Temperatura NASA POWER
        if: ${{ !cancelled() }}
        run: npm run extraer -- temperatura-power

      # Tema 4 · ECOSTRESS (ET real y estrés hídrico) vía AppEEARS
      - name: Agua ECOSTRESS
        if: ${{ !cancelled() }}
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: npm run extraer -- agua-ecostress
